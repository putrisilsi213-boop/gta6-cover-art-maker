<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Sunset Cover Studio — multi-panel poster cover maker</title>
<meta name="description" content="Turn your photo and a caption into a multi-panel sunset poster cover, offline in your browser, exported as PNG.">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>VICE SUNSET <span>COVER STUDIO</span></h1>
    <p class="tag">Your photo + a caption → a multi-panel sunset poster. Offline, no upload, PNG in seconds.</p>

    <h2>1 · Photo</h2>
    <label class="file">Add a photo <input id="photoFile" type="file" accept="image/*"></label>
    <div class="row">
      <button type="button" data-sample="pier">Sample: Pier</button>
      <button type="button" data-sample="boulevard">Sample: Boulevard</button>
    </div>
    <div class="row" id="panelTabs" role="tablist" aria-label="Panels">
      <button type="button" data-panel-tab="0">Panel 1</button>
      <button type="button" data-panel-tab="1">Panel 2</button>
      <button type="button" data-panel-tab="2">Panel 3</button>
      <button type="button" data-panel-tab="3">Panel 4</button>
    </div>
    <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"> <span id="zoomVal">100%</span></label>
    <label>Move left–right <input id="ox" type="range" min="-1" max="1" step="0.05" value="0"></label>
    <label>Move up–down <input id="oy" type="range" min="-1" max="1" step="0.05" value="0"></label>
    <button id="fillAll" type="button">Use this photo in every panel</button>

    <h2>2 · Layout &amp; grade</h2>
    <div class="row">
      <button type="button" data-layout="diagonal">Diagonal hero</button>
      <button type="button" data-layout="grid">Four panels</button>
      <button type="button" data-layout="strip">Hero + strip</button>
      <button type="button" data-layout="single">One photo</button>
    </div>
    <div class="row">
      <button type="button" data-grade="sunset">Sunset</button>
      <button type="button" data-grade="neon">Neon nights</button>
      <button type="button" data-grade="palm">Palm dusk</button>
      <button type="button" data-grade="mono">Mono violet</button>
    </div>
    <button id="random" type="button">Surprise me</button>

    <h2>3 · Caption</h2>
    <label>Title <input id="title" type="text" maxlength="24" value="Sunset Heist"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="NEON COAST • ONE LAST RIDE"></label>
    <label>Title size <input id="titleSize" type="range" min="0.7" max="1.3" step="0.05" value="1"></label>

    <h2>4 · Export</h2>
    <div class="row">
      <button type="button" data-size="square">1080 × 1080</button>
      <button type="button" data-size="portrait">1080 × 1350</button>
      <button type="button" data-size="wide">1920 × 1080</button>
    </div>
    <button id="export" type="button" class="primary">Export PNG — <span id="sizeLabel">1080 x 1080</span></button>
    <p id="status" role="status"></p>
    <p class="fine">Photos stay on your machine. All art is drawn in code — original, no game logos, artwork or fonts.</p>
  </section>
  <section class="preview" aria-label="Live preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
<script type="module" src="./src/shots.js"></script>
</body>
</html>
